name: Daily marketing data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-marketing-data
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate Google authentication secrets
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]]; then
            echo "::error::Missing or empty Actions secret: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [[ -z "$GCP_SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing or empty Actions secret: GCP_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Install report dependencies
        run: python -m pip install google-analytics-data==0.23.3 "google-auth~=2.62" requests

      - name: Collect GA4 and Meta Ads data
        env:
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID || '1goIR1S7rAzNLwTnCAeVbHp-Ko0l7M44p6B0RfUaM16w' }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '415894822' }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m scripts.daily_marketing_report
